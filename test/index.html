<script type="module">

    import Mikado from "./mikado.bundle.module.min.js";

    //
    // import tweet_template from "./tpl/partial/user.js";

    //
    import inbox_template from "./tpl/partial/inbox_list.js";
    import sent_template from "./tpl/partial/sent_list.js";
    import draft_template from "./tpl/partial/draft_list.js";
    import spam_template from "./tpl/partial/spam_list.js";
    import notify_template from "./tpl/partial/notify_list.js";
    import trash_template from "./tpl/partial/trash_list.js";

    let mail_imports = {
        "inbox" : inbox_template,
        'sent' : sent_template,
        'drafts' : draft_template,
        'spam' : spam_template,
        'notify' : notify_template,
        'trash' : trash_template
    }
    //
    let mail_classes = ['inbox','sent','drafts','spam','notify','trash']
    let mail_management = {}

    for ( let mtype of mail_classes ) {
        let store = new Mikado.Array();
        let mail_template = mail_imports[mtype]
        let view = new Mikado(mail_template, { observe: store });
        mail_management[mtype] = {
            "view" : view,
            "store" : store,
            "root" : null,
            "container_el" : null
        }
    }

    window._x_share_mail_managers = mail_management

</script>

    function store_of_mail_manager(mtype) {
        let mobj = mail_managers[mtype]
        if ( mobj ) {
            if ( mobj.store ){
                return mobj.store
            }            
        }
        return false
    }

    

    let bunch_of_mails = [
        { "sender" : "mail@a.com", "subject" : "this is 1 test", "date" : date.toLocaleString() },
        { "sender" : "mail@s.com", "subject" : "this is 2 test", "date" : date.toLocaleString() },
        { "sender" : "mail@d.com", "subject" : "this is 3 test", "date" : date.toLocaleString() },
        { "sender" : "mail@f.com", "subject" : "this is 4 test", "date" : date.toLocaleString() },
        { "sender" : "mail@g.com", "subject" : "this is 5 test", "date" : date.toLocaleString() },
    ]
    window.add_mails = (mtype) => {
        let mail_store = store_of_mail_manager(mtype)
        let new_mail_bunch = structuredClone(bunch_of_mails)
        if ( mail_store ) {
            if ( mail_store.length ) {
                mail_store.concat(new_mail_bunch)
            } else {
                mail_store.set(new_mail_bunch)
            }
        }
    }

    window.swap_two = (mtype) => {
        let mail_store = store_of_mail_manager(mtype)
        if ( mail_store ) mail_store.swap(2,5)
    }

    window.delete_two = (mtype) => {
        let mail_store = store_of_mail_manager(mtype)
        if ( mail_store ) mail_store.splice(3,2)
    }

    window.sort_mail = (mtype) => {
        let mail_store = store_of_mail_manager(mtype)
        if ( mail_store ) mail_store.sort((a,b) => {
            if ( a.sender > b.sender ) return 1
            if ( a.sender < b.sender ) return -1
            return 0
        })
    }

    window.reverse_mail = (mtype) => {
        let mail_store = store_of_mail_manager(mtype)
        if ( mail_store ) mail_store.reverse()
    }


    window.mail_switch_to  = (mtype) => {
        for ( let one_mtype in mail_managers ) {
            let mobj = mail_managers[one_mtype]
            if ( mobj.container_el ) {
                mobj.container_el.style.display = "none"
            }
        }
        let mobj = mail_managers[mtype]
        if ( mobj ) {
            if ( mobj.container_el ) {
                mobj.container_el.style.display = "block"
            }            
        }
    }
