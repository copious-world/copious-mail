<script type="module">

    import Mikado from "./mikado.bundle.module.min.js";

    //
    // import tweet_template from "./tpl/partial/user.js";
    // const tweet_view = new Mikado(tweet_template, {/* options */});
    // window._x_share_tweet_view = tweet_view

    //
    import inbox_template from "./tpl/partial/inbox_list.js";
    import sent_template from "./tpl/partial/sent_list.js";
    import draft_template from "./tpl/partial/draft_list.js";
    import spam_template from "./tpl/partial/spam_list.js";
    import notify_template from "./tpl/partial/notify_list.js";
    import trash_template from "./tpl/partial/trash_list.js";

    let mail_imports = {
        "inbox" : inbox_template,
        'sent' : sent_template,
        'drafts' : draft_template,
        'spam' : spam_template,
        'notify' : notify_template,
        'trash' : trash_template
    }
    //
    let mail_classes = ['inbox','sent','drafts','spam','notify','trash']
    let mail_management = {}

    for ( let mtype of mail_classes ) {
        let store = new Mikado.Array();
        let mail_template = mail_imports[mtype]
        let view = new Mikado(mail_template, { observe: store });
        mail_management[mtype] = {
            "view" : view,
            "store" : store,
            "root" : null,
            "container_el" : null
        }
    }

    window._x_share_mail_managers = mail_management

</script>

<script>

// https://github.com/omgovich/colord

var g_apparition = null;
var g_current_pin = null;
var g_fade_scheduled = null;
var g_defade_scheduled = null;


function hideFader(fdr) {
	fdr.style.visibility = "hidden"
    fdr.style.display = "none"
	// fdr.style.zIndex = -10
	stopDefade()
	stopFade()
	g_apparition = null;
	g_current_pin = null;
}

function closefader(ev,whichFader) {
    ev.stopPropagation()
	clear_pin_time()
	let fdr = document.querySelector('#' + whichFader);
	hideFader(fdr)
}

function closesolid(whichSolid) {
	let sld = document.querySelector('#' + whichSolid);
	sld.style.visibility = "hidden"
	sld.style.display = "none";
}
// ---- ---- ---- ---- ---- ----

let g_pin_time = false
function newest_pin(pinned) {
	g_pin_time = Date.now()
	setTimeout(() => { g_pin_time = false }, 5500 )
}

function recent_pin(pinned) {
	if ( g_pin_time === false ) {
		return false
	}
	let check_time = Date.now()
	if ( (check_time - g_pin_time)  > 5000 ) {
		g_pin_time = false
		return false
	}
	return true
}

function clear_pin_time() {
	g_pin_time = false
}


function unpin_current(timeless) {
	if ( g_current_pin && !timeless && recent_pin(g_current_pin) ) {
		return false
	}
	if ( g_current_pin != null ) {
        g_current_pin.style.visibility = "hidden";
		g_current_pin.style.display = "none";
//		g_current_pin.style.zIndex = -10
	}
	return true
}
function fade_apparition(btn,evt) {
	if ( g_apparition !== null ) {
		var fader = g_apparition;
		//if ( evt ) console.log(fader.offsetWidth + "," + evt.clientX + "," + window.innerWidth)
		if ( ( evt !== undefined )&& (fader.offsetWidth >= evt.clientX) ) {
			return;
		}
		stopDefade()
		g_defade_scheduled = setInterval(() => { lowerAlpha(fader); },g_fader_interval);
	}
}
function stopDefade() {
	if ( g_defade_scheduled != null ) {
		clearInterval(g_defade_scheduled);
	}
}
function stopFade() {
	if ( g_fade_scheduled != null ) {
		clearInterval(g_fade_scheduled);
	}
}
function pin_ItsAlive(pinned) {
	newest_pin(pinned)
	if ( pinned && (typeof pinned.openAction === 'function')) {
		pinned.openAction()
	}
	g_apparition = null;
}
// ---- ---- ---- ---- ---- ----
function raiseAlpha(aGhost) {
	if ( aGhost.style.opacity == 1.0 ) {
		stopDefade()
		pinBoxElem(aGhost)
	} else {
		aGhost.style.opacity = parseFloat(aGhost.style.opacity) + 0.025;
	}
}
function lowerAlpha(aGhost) {
	if ( aGhost.style.opacity <= 0.2 ) {
		hideFader(aGhost)
	} else {
		aGhost.style.opacity = parseFloat(aGhost.style.opacity) - 0.1;
	}
}
// ---- ---- ---- ---- ---- ----
function replaceApparition(newGhost) {
	if ( !unpin_current() ) {
		return
	}
	if ( g_apparition !== null ) {
		stopDefade()
		stopFade()
        g_apparition.style.display = "none"
		g_apparition.style.visibility = "hidden";
//		newGhost.style.zIndex = -10
	}
	if ( newGhost !== null ) {
		newGhost.style.opacity = "0.0"
        newGhost.style.display = "block"
		newGhost.style.visibility = "visible"
//		newGhost.style.zIndex = 200
		g_apparition = newGhost
		g_defade_scheduled = setInterval(() => { raiseAlpha(newGhost); },50);
	}
}

function pinBoxElem(thisPin) {
	clear_pin_time()
	// if ( g_current_pin !== thisPin ) unpin_current();
	g_current_pin = thisPin;
	stopDefade()
	thisPin.style.opacity = "0.0"
    thisPin.style.display = "block"

	thisPin.style.opacity = "1.0"
	pin_ItsAlive(g_current_pin);

let draggers = {}
let current_dragger = false

let dragger_z_map = {}
function rotate_z_index(drag_Node) {
    //
    let zs = Object.keys(dragger_z_map)
    let z = zs[zs.length-1]
    let waz = parseInt(drag_Node.style.zIndex)
    while ( waz < z ) {
        let demoted = dragger_z_map[waz+1]
        dragger_z_map[waz] = demoted
        demoted.style.zIndex = waz
        waz++
    }
    dragger_z_map[z] = drag_Node
    drag_Node.style.zIndex = z
    //
}

function manage_z_index(drag_bars) {

    let minz = 10000

    for ( let db of drag_bars ) {
        let pnode = db.parentNode
        let z = parseInt(pnode.style.zIndex)
        if ( z < minz ) {
            minz = z
        }
    }

    let z = minz
    for ( let db of drag_bars ) {
        let pnode = db.parentNode
        pnode.style.zIndex = z
        dragger_z_map[z] = pnode
        z++
    }

}


function add_dragging() {

    let drag_bars = document.getElementsByClassName("togglebar")
    manage_z_index(drag_bars)
    for ( let db of drag_bars ) {

        let cname = db.parentNode.className
        if ( cname.indexOf(' ') > 0 ) {
            cname = cname.split(' ')[0]
        }

        if ( cname === 'solid_able' ) {
            if ( db.parentNode.id === "intergalactic-explain" ) {
                cname = "fade_able"
            }
        }

        if ( ["fade_able","right_fade_able"].indexOf(cname) >= 0 ) {
            let drag_Node = db.parentNode
            draggers[drag_Node.id] = {
                "offsetX" : 0,
                "offsetY" : 0,
                "isDragging" : false,
                "dragged" : drag_Node,
                "drag_control" : db
            }

            db.onmousedown = (e) => {
                let drag_Node = e.target.parentNode;
                if ( !draggers[drag_Node.id] ) return
                rotate_z_index(drag_Node)
                e.preventDefault()
                draggers[drag_Node.id].isDragging = true;
                // Calculate the offset between the mouse position and the div's top-left corner
                draggers[drag_Node.id].offsetX = e.clientX - drag_Node.getBoundingClientRect().left;
                draggers[drag_Node.id].offsetY = e.clientY - drag_Node.getBoundingClientRect().top;
                db.style.cursor = 'grabbing';
                current_dragger = drag_Node.id
            }

            db.onmouseup = (ev) => {
                if ( current_dragger ) {
                    let dragger_stats = draggers[current_dragger]
                    let drag_bar = dragger_stats.drag_control
                    drag_bar.style.cursor = 'move';
                }
            }
        }
    }

    document.addEventListener('mousemove', (e) => {
        if (!current_dragger) return;

        if ( current_dragger ) {
            let dragger_stats = draggers[current_dragger]
            let drag_Node = dragger_stats.dragged
            // Calculate new position based on mouse movement and offsetif 
            if ( drag_Node ) {
                let mouseX = e.clientX
                let mouseY = e.clientY
                //
                let newX = mouseX - dragger_stats.offsetX;
                let newY = mouseY - dragger_stats.offsetY;
                //
                if ( newX > 5 && newX < window.innerWidth ) {
                    drag_Node.style.left = `${newX}px`;
                }
                //
                let stopper = document.getElementsByTagName("footer")[0]
                let stoRect = stopper ? stopper.getBoundingClientRect() : false
                let maxY = stoRect ? stoRect.top : 500
                //
                if ( (newY > 5) && (newY < window.innerHeight) && (newY < maxY )) {
                    drag_Node.style.top = `${newY}px`;
                }
            }
        }

    });

    document.addEventListener('mouseup', () => {
        if ( current_dragger ) {
            let dragger_stats = draggers[current_dragger]
            let drag_bar = dragger_stats.drag_control
            drag_bar.style.cursor = 'move';
        }
        current_dragger = false
    });

}
add_dragging()



let resizers = {}
let current_resizer = false


function add_resizing() {
    let sizer_bobs = document.getElementsByClassName("sizerbar")
    for ( let sb of sizer_bobs ) {
        let pnode = sb.parentNode

        resizers[pnode.id] = {
            "isDragging" : false,
            "dragged" : pnode,
            "drag_control" : sb
        }

        sb.onmousedown = (e) => {
            let pnode = e.target.parentNode;
            if ( !resizers[pnode.id] ) return
            e.preventDefault()
            resizers[pnode.id].isDragging = true;
            current_resizer = pnode.id
        }
  
    }


    document.addEventListener('mousemove', (e) => {
        if (!current_resizer) return;

        if ( current_resizer ) {
            let resizer_stats = resizers[current_resizer]
            let pnode = resizer_stats.dragged
            // Calculate new position based on mouse movement and offsetif 
            if ( pnode ) {
                const newX = e.clientX;
                const newY = e.clientY;
                //
                let brect = pnode.getBoundingClientRect()
                let newW = newX - brect.left
                let newH = newY - brect.top
                //
                if ( newW > 60 ) {
                    pnode.style.width = `${newW}px`;
                }
                if ( newH > 60 ) {
                    pnode.style.height = `${newH}px`;
                }
            }
        }

    });


    document.addEventListener('mouseup', () => {
        current_resizer = false
    });

}

add_resizing()
